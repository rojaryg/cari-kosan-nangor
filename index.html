<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* --- 1. TEMA DEFAULT (GELAP - AKSEN BIRU) --- */
  :root {
    --bg-outer: #000000;
    --bg: #151b23; 
    --bg-2: #1e2631; 
    --bg-3: #0d1117; 
    --text: #f0f6fc; 
    --text-2: #8b949e; 
    --text-3: #6e7681; 
    --border: rgba(255,255,255,0.1);
    --border-2: #388bfd; 
    --accent: #388bfd; 
    --accent-hover: #2f74c7;
    
    --green-bg: #173404; --green-text: #C0DD97; --green-bd: #3B6D11;
    --amber-bg: #412402; --amber-text: #FAC775; --amber-bd: #854F0B;
    --coral-bg: #4A1B0C; --coral-text: #F0997B; --coral-bd: #993C1D;
    --blue-bg: #042C53; --blue-text: #85B7EB; --blue-bd: #185FA5;
    --red-bg: #501313; --red-text: #F09595; --red-bd: #8a1d1d;

    --font: 'Plus Jakarta Sans', sans-serif;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2); 
    --radius: 16px;
    --radius-sm: 8px;
  }

  /* --- 2. TEMA TERANG (AKSEN BIRU) --- */
  [data-theme="light"] {
    --bg-outer: #E2E8F0;
    --bg: #FFFFFF;      
    --bg-2: #F1F5F9;    
    --bg-3: #F8FAFC;    
    --text: #0F172A;    
    --text-2: #475569;  
    --text-3: #94A3B8;  
    --border: #E2E8F0;    
    --border-2: #2563EB; 
    --accent: #2563EB;
    --accent-hover: #1D4ED8;
    
    --green-bg: #DCFCE7; --green-text: #166534; --green-bd: #BBF7D0;
    --amber-bg: #FEF3C7; --amber-text: #92400E; --amber-bd: #FDE68A;
    --coral-bg: #FEE2E2; --coral-text: #991B1B; --coral-bd: #FECACA;
    --red-bg: #FEE2E2;   --red-text: #B91C1C; --red-bd: #FECACA;
    --blue-bg: #DBEAFE;  --blue-text: #1E40AF; --blue-bd: #BFDBFE;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
  }

  /* --- 3. TEMA MIKU (PINK SAKURA & TEAL) --- */
  [data-theme="miku"] {
    --bg-outer: #00C4B6; 
    --bg-3: #bce8e4;     
    --bg: #FFF0F7;       
    --bg-2: #D8F5F3;     
    --text: #1A2B2A; 
    --text-2: #005D57; 
    --text-3: #007871;
    --border: #99D5D0; 
    --border-2: #E3007F; 
    --accent: #E3007F;   
    --accent-hover: #C7006E;
    
    --red-bg: #FCE6F1; --red-text: #E3007F; --red-bd: #FBCFE8;
    --blue-bg: #D8F5F3; --blue-text: #006B65; --blue-bd: #99D5D0;
    --green-bg: #D8F5F3; --green-text: #006B65; --green-bd: #99D5D0;
    --amber-bg: #FEF3C7; --amber-text: #92400E; --amber-bd: #FDE68A;
    
    --shadow: 0 4px 6px -1px rgba(0, 160, 150, 0.15), 0 2px 4px -1px rgba(0, 160, 150, 0.1);
  }

  body { 
    font-family: var(--font); background-color: var(--bg-outer); 
    color: var(--text); display: flex; justify-content: center; min-height: 100vh;
  }
  
  .app-container {
    width: 100%; max-width: 480px; background-color: var(--bg-3);
    min-height: 100vh; display: flex; flex-direction: column; position: relative;
    box-shadow: 0 0 20px rgba(0,0,0,0.5); overflow-x: hidden;
  }

  .header {
    background-color: var(--bg); padding: 20px 20px 15px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }

  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }

  .title-area h1 {
    font-size: 20px; font-weight: 700; color: var(--text); display: flex;
    align-items: center; gap: 8px; margin-bottom: 4px;
  }
  .title-area h1 i { color: var(--accent); font-size: 24px; }
  .title-area p { font-size: 12px; color: var(--text-2); }

  .search-box { position: relative; margin-bottom: 16px; }
  .search-box i {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 18px; color: var(--text-3);
  }
  .search-box input {
    width: 100%; padding: 14px 16px 14px 44px; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: var(--radius); font-family: var(--font); font-size: 14px; color: var(--text); outline: none; transition: all 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(227, 0, 127, 0.15); }

  .scroll-x-container { display: flex; flex-direction: column; gap: 12px; }
  .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -ms-overflow-style: none; scrollbar-width: none; }
  .chip-row::-webkit-scrollbar { display: none; }
  
  .chip {
    padding: 8px 16px; border-radius: 20px; background: var(--bg-2); border: 1px solid var(--border);
    color: var(--text-2); font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: all 0.2s;
  }
  .chip:active { transform: scale(0.96); }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip-theme { font-size: 12px; padding: 6px 12px; }

  .main-content { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .stats-text { font-size: 13px; color: var(--text-2); margin-bottom: 4px; font-weight: 500; }

  .card {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow); transition: all 0.2s; overflow: hidden;
  }
  .card:active { transform: scale(0.98); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;}
  .card-title { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 6px; }
  
  .card-rating {
    display: flex; align-items: center; gap: 4px; background: rgba(245, 158, 11, 0.1); color: #F59E0B;
    padding: 4px 8px; border-radius: 8px; font-size: 13px; font-weight: 700; flex-shrink: 0; border: 1px solid rgba(245, 158, 11, 0.2);
  }
  
  .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge-area { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-2); font-weight: 500;}
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  
  .badge { font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 600; display:flex; align-items:center; gap:4px; }
  .badge-hot { background: var(--red-bg); color: var(--red-text); border: 1px solid var(--red-bd); }
  .badge-terbaik { background: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-bd); }

  .card-address { font-size: 13px; color: var(--text-3); display: flex; gap: 6px; align-items: flex-start; line-height: 1.4; }
  .card-address i { font-size: 16px; color: var(--text-3); flex-shrink: 0; margin-top: 2px;}

  .card-detail {
    display: none; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border); animation: fadeIn 0.3s ease;
  }
  .card.open .card-detail { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

  .btn-action {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px;
    border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer;
    border: none; transition: all 0.2s; margin-bottom: 8px; font-family: var(--font);
  }
  .btn-maps { background: #4285F4; color: white; }
  .btn-maps:active { background: #3367D6; }
  
  .btn-web { background: var(--bg-2); color: var(--text-2); border: 1px solid var(--border); }
  
  .toggle-text { text-align: center; font-size: 12px; color: var(--accent); font-weight: 600; margin-top: 12px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-3); }
  .empty-state i { font-size: 48px; margin-bottom: 12px; opacity: 0.5;}
  .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: var(--text);}
  .empty-state p { font-size: 13px; }

</style>
</head>

<div class="app-container">

    <div class="header-top">
      <div class="title-area">
        <h1><i class="ti ti-home-search"></i> Kosan Jatinangor</h1>

      <div style="display: flex; gap: 4px;">

        <button class="chip chip-theme" id="btnMiku" onclick="setTheme('miku')">
            <span style="font-weight:700; font-family: 'DM Mono', monospace; letter-spacing:-1px;">ミク</span>
        </button>
      </div>
    </div>

    <div class="search-box">
      <i class="ti ti-search"></i>
      <input type="text" id="searchInput" placeholder="Cari nama kosan atau jalan...">
    </div>

    <div class="scroll-x-container">
      <div class="chip-row" id="areaChips"></div>
      <div class="chip-row">
        <div class="chip active" id="chipRating" onclick="toggleRating()">⭐ Semua Rating</div>
        <div class="chip" id="chipSort" onclick="toggleSort()"><i class="ti ti-arrows-sort"></i> Ulasan Terbanyak</div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="stats-text" id="statsText">Memuat data...</div>
    <div id="cardContainer" style="display: flex; flex-direction: column; gap: 12px;"></div>
  </main>
</div>

  if (themeName === 'dark') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', themeName);
  
  localStorage.setItem('kosan-theme-mobile', themeName);
  
  ['btnDark', 'btnLight', 'btnMiku'].forEach(id => {
    document.getElementById(id).style.color = (id.toLowerCase().includes(themeName) || (themeName==='dark' && id==='btnDark')) ? 'var(--accent)' : 'var(--text-2)';
  });
}

const kosanData = rawKosanData.map(k => {
  k.hot = k.reviews >= 100;
  k.isTerbaik = k.rating === 5.0;
  
  // Format link Google Maps YANG BENAR: https://www.google.com/maps/search/?api=1&query=
  const searchQuery = encodeURIComponent(k.name + " Jatinangor");
  k.mapsLink = `https://www.google.com/maps/search/?api=1&query=${searchQuery}`;

  return k;
});

// State
let activeArea = "Semua", ratingFilter = false, sortBy = "ulasan", searchQ = "", openCard = null;

// INIT FILTERS
function renderAreaChips() {
  const areas = ["Semua", ...Object.keys(AREA_COLORS)];
  document.getElementById("areaChips").innerHTML = areas.map(a => `
    <div class="chip ${activeArea === a ? 'active' : ''}" onclick="setArea('${a}')">
      ${a !== 'Semua' ? `<span class="dot" style="background:${AREA_COLORS[a]}; border: 1px solid rgba(255,255,255,0.3)"></span>` : ''}
      ${a}
    </div>
  `).join("");
}

function setArea(area) { activeArea = area; openCard = null; render(); }

function toggleRating() {
  ratingFilter = !ratingFilter;
  const btn = document.getElementById("chipRating");
  if(ratingFilter) {
    btn.classList.add("active");
    btn.innerHTML = "⭐ Terbaik (5.0)";
  } else {
    btn.classList.remove("active");
    btn.innerHTML = "⭐ Semua Rating";
  }
  openCard = null; render();
}

const sortOptions = [
  {id: 'ulasan', label: '<i class="ti ti-messages"></i> Terpopuler'},
  {id: 'rating', label: '<i class="ti ti-star"></i> Rating Tertinggi'},
  {id: 'az', label: '<i class="ti ti-sort-a-z"></i> Abjad (A-Z)'}
];
let sortIndex = 0;
function toggleSort() {
  sortIndex = (sortIndex + 1) % sortOptions.length;
  sortBy = sortOptions[sortIndex].id;
  document.getElementById("chipSort").innerHTML = sortOptions[sortIndex].label;
  openCard = null; render();
}

document.getElementById("searchInput").addEventListener("input", e => { searchQ = e.target.value.toLowerCase(); openCard = null; render(); });

function toggleCard(name) {
  openCard = openCard === name ? null : name;
  renderCards(filteredData());
}

function filteredData() {
  let list = kosanData.filter(k => {
    if (activeArea !== "Semua" && k.area !== activeArea) return false;
    if (ratingFilter && !k.isTerbaik) return false;
    if (searchQ) {
      const terms = searchQ.split(',').map(t => t.trim()).filter(t => t !== "");
      if (terms.length > 0) {
        const match = terms.some(term => k.name.toLowerCase().includes(term) || k.address.toLowerCase().includes(term));
        if (!match) return false;
      }
    }
    return true;
  });

  if (sortBy === "az") list.sort((a, b) => a.name.localeCompare(b.name));
  else if (sortBy === "rating") list.sort((a, b) => b.rating - a.rating);
  else list.sort((a, b) => b.reviews - a.reviews);

  return list;
}

function renderCards(list) {
  const container = document.getElementById("cardContainer");
  document.getElementById("statsText").innerHTML = `Menampilkan ${list.length} kosan`;

  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <i class="ti ti-ghost"></i>
        <h3>Tidak ada hasil</h3>
        <p>Coba hapus filter atau ganti kata kunci pencarianmu.</p>
      </div>`;
    return;
  }

  container.innerHTML = list.map(k => {
    const isOpen = openCard === k.name;
    const mapsBtn = `<a href="${k.mapsLink}" target="_blank" class="btn-action btn-maps"><i class="ti ti-map-search" style="font-size:18px"></i> Buka di Google Maps</a>`;
    const webBtn = k.website 
      ? `<a href="${k.website}" target="_blank" class="btn-action btn-web"><i class="ti ti-world" style="font-size:18px"></i> Buka Website / Link</a>` 
      : '';

    return `
      <div class="card ${isOpen ? 'open' : ''}" onclick="toggleCard('${k.name.replace(/'/g, "\\'")}')">
        <div class="card-top">
          <div style="flex: 1;">
            <div class="card-title">${k.name}</div>
            <div class="card-meta">
              <span class="badge-area"><span class="dot" style="background:${AREA_COLORS[k.area] || '#64748B'}"></span>${k.area}</span>
              ${k.hot ? '<span class="badge badge-hot"><i class="ti ti-flame" style="font-size:12px"></i> Populer</span>' : ''}
              ${k.isTerbaik ? '<span class="badge badge-terbaik">Terbaik</span>' : ''}
            </div>
          </div>
          <div class="card-rating">
            <i class="ti ti-star-filled"></i> ${k.rating} <span style="font-size:10px; opacity:0.7">(${k.reviews})</span>
          </div>
        </div>
        
        <div class="card-address"><i class="ti ti-map-pin"></i> ${k.address}</div>
        
        ${!isOpen ? `<div class="toggle-text">Ketuk untuk lihat detail <i class="ti ti-chevron-down" style="font-size:12px; vertical-align:middle"></i></div>` : ''}

        <div class="card-detail" onclick="event.stopPropagation()">
          ${mapsBtn}
          ${webBtn}
        </div>
      </div>
    `;
  }).join("");
}

function render() {
  renderAreaChips();
  renderCards(filteredData());
}

// Initial render
render();
</script>
